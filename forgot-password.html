<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Hotel Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-to-login {
            text-align: center;
        }

        .back-to-login a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-to-login a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            margin-bottom: 15px;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .loading.active {
            display: block;
        }

        .success-content {
            text-align: center;
            display: none;
        }

        .success-content.show {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .success-content h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .success-content p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .form-content {
            display: block;
        }

        .form-content.hide {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔑 Forgot Password?</h1>
            <p>No worries, we'll help you reset it</p>
        </div>

        <div class="form-content">
            <div class="info-box">
                Enter your email address and we'll send you a link to reset your password.
            </div>

            <div id="message" class="message"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="manager@hotel.com"
                        required
                        autocomplete="email"
                    />
                </div>

                <button type="submit" id="submitBtn">Send Reset Link</button>

                <div class="loading" id="loading">
                    Sending reset link...
                </div>
            </form>

            <div class="back-to-login">
                <a href="manager-login.html">← Back to Login</a>
            </div>
        </div>

        <div class="success-content" id="successContent">
            <div class="success-icon">✓</div>
            <h2>Check Your Email</h2>
            <p>We've sent a password reset link to your email address.</p>
            <p style="color: #999; font-size: 12px;">The link will expire in 1 hour.</p>
            <button onclick="location.href='manager-login.html'" style="margin-top: 20px;">Back to Login</button>
        </div>
    </div>

    <script>
        const SUPABASE_PROJECT_ID = 'wabecmyyusiwmvctoiwu';
        const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;

        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');
        const formContent = document.querySelector('.form-content');
        const successContent = document.getElementById('successContent');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                message.className = 'message error';
                message.textContent = '✗ Please enter your email address';
                return;
            }

            loading.classList.add('active');
            loading.textContent = 'Sending reset link...';
            submitBtn.disabled = true;
            message.className = 'message';
            message.textContent = '';

            try {
                // Get the current page URL to create redirect
                const baseUrl = window.location.origin;
                const redirectUrl = `${baseUrl}/reset-password.html`;

                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/password-reset`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            redirect_url: redirectUrl
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {
                    // Show success screen
                    formContent.classList.add('hide');
                    successContent.classList.add('show');
                } else {
                    message.className = 'message error';
                    message.textContent = `✗ ${data.message || 'Failed to send reset link'}`;
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = `✗ Error: ${error.message}`;
                console.error('Error:', error);
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
            }
        });

        // Focus on email input
        emailInput.focus();
    </script>
</body>
</html>
