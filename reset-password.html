<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Hotel Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: #dc3545;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-bar.weak {
            width: 25%;
            background: #dc3545;
        }

        .strength-bar.fair {
            width: 50%;
            background: #ffc107;
        }

        .strength-bar.good {
            width: 75%;
            background: #17a2b8;
        }

        .strength-bar.strong {
            width: 100%;
            background: #28a745;
        }

        .strength-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            text-align: right;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-top: 12px;
        }

        .loading.active {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Reset Password</h1>
            <p>Set your new password</p>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="••••••••"
                    required
                    autocomplete="new-password"
                />
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-label" id="strengthLabel">Create a strong password</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="••••••••"
                    required
                    autocomplete="new-password"
                />
            </div>

            <button type="submit" id="submitBtn">Reset Password</button>

            <div class="loading" id="loading">
                Resetting password...
            </div>

            <div class="message" id="message"></div>
        </form>

        <div class="back-link">
            <a href="manager-login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const SUPABASE_PROJECT_ID = 'wabecmyyusiwmvctoiwu';
        const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhYmVjbXl5dXNpd212Y3RvaXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjA0OTEsImV4cCI6MjEwNTAzNjQ5MX0.xIkv_WBffIVilW-ADc8Tn3iwzpSbbQsZFrrXRqwkiSE';

        const form = document.getElementById('resetPasswordForm');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        newPasswordInput.addEventListener('input', () => {
            updatePasswordStrength(newPasswordInput.value);
        });

        function updatePasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');
            const strengthLabel = document.getElementById('strengthLabel');

            strengthBar.classList.remove('weak', 'fair', 'good', 'strong');

            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

            const strength = [hasLength, hasUpper, hasLower, hasNumber, hasSpecial].filter(Boolean).length;

            if (strength === 0) {
                strengthLabel.textContent = 'Create a strong password';
            } else if (strength < 3) {
                strengthBar.classList.add('weak');
                strengthLabel.textContent = 'Weak password';
            } else if (strength < 4) {
                strengthBar.classList.add('fair');
                strengthLabel.textContent = 'Fair password';
            } else if (strength < 5) {
                strengthBar.classList.add('good');
                strengthLabel.textContent = 'Good password';
            } else {
                strengthBar.classList.add('strong');
                strengthLabel.textContent = 'Strong password ✓';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!newPassword || !confirmPassword) {
                message.className = 'message error';
                message.textContent = '✗ Please fill in all fields';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.className = 'message error';
                message.textContent = '✗ Passwords do not match';
                return;
            }

            if (newPassword.length < 8) {
                message.className = 'message error';
                message.textContent = '✗ Password must be at least 8 characters';
                return;
            }

            loading.classList.add('active');
            submitBtn.disabled = true;
            message.className = 'message';
            message.textContent = '';

            try {
                // Load Supabase script dynamically if not already loaded
                if (!window.supabase) {
                    await new Promise((resolve) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                        script.onload = resolve;
                        document.head.appendChild(script);
                    });
                }

                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    throw new Error(error.message);
                }

                message.className = 'message success';
                message.textContent = '✓ Password reset successfully! Redirecting to login...';

                setTimeout(() => {
                    window.location.href = 'manager-login.html';
                }, 1500);
            } catch (error) {
                message.className = 'message error';
                message.textContent = `✗ ${error.message || 'Failed to reset password'}`;
                console.error('Error:', error);
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
