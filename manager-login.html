<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Manager Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }

        .demo-info {
            margin-top: 20px;
            padding: 12px;
            background: #f0f7ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 12px;
            color: #555;
        }

        .demo-info h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .demo-info code {
            background: #e8f0ff;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }

        .forgot-password {
            text-align: right;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏨 Hotel Admin</h1>
            <p>Manager Login</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="manager@hotel.com"
                    required
                    autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                />
            </div>

            <div class="forgot-password">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">
                Sign In
            </button>

            <div class="loading" id="loading">
                Logging in...
            </div>

            <div class="message" id="message"></div>
        </form>

        <div class="demo-info">
            <h4>📝 Demo Credentials (for testing)</h4>
            <p>
                Email: <code>manager@test.com</code><br>
                Password: <code>Test123!@#</code>
            </p>
            <p style="margin-top: 8px; opacity: 0.7;">
                Note: Use actual manager credentials once users are created in Supabase.
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        // Supabase client
        const SUPABASE_PROJECT_ID = 'wabecmyyusiwmvctoiwu';
        const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhYmVjbXl5dXNpd212Y3RvaXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjA0OTEsImV4cCI6MjEwNTAzNjQ5MX0.xIkv_WBffIVilW-ADc8Tn3iwzpSbbQsZFrrXRqwkiSE';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous messages
            message.className = 'message';
            message.textContent = '';

            // Show loading state
            loading.classList.add('active');
            loginBtn.disabled = true;

            try {
                const email = emailInput.value;
                const password = passwordInput.value;

                // Sign in with Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    throw new Error(authError.message);
                }

                if (!authData.user) {
                    throw new Error('Login failed: No user returned');
                }

                // Get user profile with role and password_needs_reset
                const { data: userProfile, error: profileError } = await supabaseClient
                    .from('user_profiles')
                    .select('id, full_name, email, role_id, password_needs_reset')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) {
                    throw new Error('Failed to fetch user profile');
                }

                // Get user role name
                const { data: roleData } = await supabaseClient
                    .from('roles')
                    .select('name')
                    .eq('id', userProfile.role_id)
                    .single();

                const userData = {
                    id: userProfile.id,
                    email: userProfile.email,
                    full_name: userProfile.full_name,
                    role: roleData?.name || 'unknown',
                    password_needs_reset: userProfile.password_needs_reset
                };

                // Store in localStorage
                try {
                    localStorage.setItem('authToken', authData.session.access_token);
                    localStorage.setItem('user', JSON.stringify(userData));
                    console.log('✓ localStorage saved:', { token: authData.session.access_token.substring(0, 20) + '...', user: userData.email });
                } catch (storageError) {
                    console.error('❌ localStorage error:', storageError);
                    message.className = 'message error';
                    message.textContent = `✗ Storage error: ${storageError.message}. Are you in a private/incognito window?`;
                    loginBtn.disabled = false;
                    loading.classList.remove('active');
                    return;
                }

                // Show success message
                message.className = 'message success';
                message.textContent = `✓ Login successful! Welcome, ${userData.full_name}`;

                // Redirect based on password reset flag
                if (userData.password_needs_reset) {
                    setTimeout(() => {
                        window.location.href = 'change-password.html';
                    }, 1500);
                } else {
                    // Redirect to appropriate dashboard
                    setTimeout(() => {
                        window.location.href = 'super-admin-dashboard.html';
                    }, 1500);
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = `✗ ${error.message}`;
                console.error('Login error:', error);
            } finally {
                loading.classList.remove('active');
                loginBtn.disabled = false;
            }
        });

        // Function to show dashboard after login
        function showDashboard(user, token) {
            document.body.innerHTML = `
                <div class="login-container">
                    <div class="logo">
                        <h1>✓ Login Successful!</h1>
                    </div>
                    <div class="message success">
                        <strong>You are now logged in!</strong>
                    </div>
                    <div style="margin-top: 20px; padding: 20px; background: #f5f5f5; border-radius: 8px;">
                        <h3 style="color: #667eea; margin-bottom: 15px;">User Information</h3>
                        <p><strong>Name:</strong> ${user.full_name}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Role:</strong> ${user.role}</p>
                        <p><strong>Properties:</strong> ${user.properties.join(', ') || 'None assigned'}</p>
                        <p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;"><strong>Auth Token:</strong></p>
                        <code style="display: block; word-break: break-all; background: #fff; padding: 10px; border-radius: 4px; margin-top: 8px; font-size: 11px;">${token}</code>
                    </div>
                    <p style="margin-top: 20px; color: #999; font-size: 13px;">
                        ✓ Your authentication is working! The next step is to build the manager dashboard.
                    </p>
                </div>
            `;
        }

        // Focus on first input
        emailInput.focus();
    </script>
</body>
</html>
