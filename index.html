<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha - Hotel Booking Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            height: 80vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9f9f9;
        }

        .message {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.agent {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.5; }
            30% { opacity: 1; }
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            background: white;
        }

        .input-field {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 60px;
        }

        .send-btn:hover {
            background: #5568d3;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                max-height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 90%;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Neha 👋</h1>
            <p>Hotel Booking Assistant</p>
        </div>

        <div class="chat-box" id="chatBox">
            <!-- Messages will appear here -->
        </div>

        <div class="input-area">
            <input
                type="text"
                class="input-field"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            >
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://wabecmyyusiwmvctoiwu.supabase.co';
        const CHAT_PROXY_URL = `${SUPABASE_URL}/functions/v1/chat-proxy`;
        const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/booking-functions`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let conversationHistory = [];

        // System prompt
        const SYSTEM_PROMPT = `You are Neha, a friendly hotel booking assistant. Your job is to help guests create new bookings and modify existing bookings.

GUIDELINES:
- Be conversational and friendly
- For booking creation: Ask for property, room type, dates, name, and phone sequentially
- For booking modification: Ask for confirmation number and phone first, then show current details
- When calling functions, include ONLY the parameters the guest wants to change (omit optional ones for modify_booking)
- Show clear status: Use ✅ for success, ⏳ for processing
- For modifications: Say "Got it! Updating..." then process, then "✅ Done! [changes]"
- Always confirm booking details before creating/modifying
- Keep responses brief and conversational
- If guest asks for multiple changes at once (e.g., name and phone), collect all values then update together

IMPORTANT: When you need to call a function, use tool_use format`;

        // Tool definitions for Claude
        const TOOLS = [
            {
                name: "check_availability",
                description: "Check whether a room is available for dates",
                input_schema: {
                    type: "object",
                    properties: {
                        property_name: { type: "string", description: "Mackey Garden or Blossom Hotel" },
                        room_type: { type: "string", enum: ["standard_non_ac", "deluxe", "super_deluxe"] },
                        check_in: { type: "string", description: "YYYY-MM-DD" },
                        check_out: { type: "string", description: "YYYY-MM-DD" }
                    },
                    required: ["property_name", "room_type", "check_in", "check_out"]
                }
            },
            {
                name: "create_booking",
                description: "Create a new hotel booking",
                input_schema: {
                    type: "object",
                    properties: {
                        property_name: { type: "string" },
                        room_type: { type: "string" },
                        check_in: { type: "string" },
                        check_out: { type: "string" },
                        guest_name: { type: "string" },
                        guest_phone: { type: "string" }
                    },
                    required: ["property_name", "room_type", "check_in", "check_out", "guest_name", "guest_phone"]
                }
            },
            {
                name: "get_booking_details",
                description: "Get details of an existing booking",
                input_schema: {
                    type: "object",
                    properties: {
                        booking_id: { type: "string" },
                        guest_phone: { type: "string" }
                    },
                    required: ["booking_id", "guest_phone"]
                }
            },
            {
                name: "modify_booking",
                description: "Modify an existing booking",
                input_schema: {
                    type: "object",
                    properties: {
                        booking_id: { type: "string" },
                        guest_phone: { type: "string" },
                        new_guest_name: { type: "string" },
                        new_guest_phone: { type: "string" },
                        new_property_name: { type: "string" },
                        new_room_type: { type: "string" },
                        new_check_in: { type: "string" },
                        new_check_out: { type: "string" }
                    },
                    required: ["booking_id", "guest_phone"]
                }
            },
            {
                name: "cancel_booking",
                description: "Cancel a booking",
                input_schema: {
                    type: "object",
                    properties: {
                        booking_id: { type: "string" },
                        guest_phone: { type: "string" }
                    },
                    required: ["booking_id", "guest_phone"]
                }
            }
        ];

        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'agent'}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            msgDiv.appendChild(content);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message agent';
            msgDiv.id = 'typing-indicator';

            const dots = document.createElement('div');
            dots.className = 'typing-indicator';
            dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            msgDiv.appendChild(dots);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        async function callFunction(name, args) {
            try {
                const response = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ function: name, args })
                });

                if (!response.ok) throw new Error(`Function ${name} failed`);
                return await response.json();
            } catch (error) {
                console.error(`Function call error: ${error.message}`);
                throw error;
            }
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            sendBtn.disabled = true;

            showTyping();
            conversationHistory.push({ role: 'user', content: message });

            try {
                // Call the chat proxy Edge Function
                let response = await fetch(CHAT_PROXY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `API error: ${response.status}`);
                }

                let data = await response.json();
                removeTyping();
                addMessage(data.message);

            } catch (error) {
                removeTyping();
                addMessage(`❌ Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            userInput.focus();
        });
    </script>
</body>
</html>
